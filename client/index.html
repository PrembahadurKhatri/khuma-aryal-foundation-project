<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Analytics (GA4) — tracks visitor traffic/behavior. Placed
         as early as possible in <head> per Google's own install
         instructions, so it fires before anything else can block it. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0X62WNHB7F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-0X62WNHB7F");
    </script>
    <!-- haha.webp is a clean, transparent-background export of the KAF
         emblem -- swapped in for logo.jpg (which had a visible light-blue
         background box around the same logo). These pointed at a
         "haha.png" that was never actually in public/images/ -- every
         single page load was firing a 404 favicon request (a real disk
         read + miss, on every visitor, forever) until this was caught. -->
    <link rel="icon" type="image/webp" href="/images/haha.webp" />
    <link rel="apple-touch-icon" href="/images/haha.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Khuma Aryal Foundation — working for Education, Healthcare, Sports & Employment, guiding young people away from problems through good counselling."
    />
    <title>Khuma Aryal Foundation</title>

    <!-- Open Graph / Twitter Card — controls the title, description, and
         preview image shown when this link is shared on Facebook,
         WhatsApp, Twitter/X, LinkedIn, etc. Without these, a shared link
         shows no image and lets the platform guess at a title, which
         often looks broken or blank.

         og-share.jpg (not haha.png, and not logo.jpg) is used here
         deliberately: haha.png is the clean, transparent-background KAF
         emblem used elsewhere (favicon, etc.), but at 969KB it turned out
         WhatsApp's link-preview crawler silently skips fetching images
         that large/slow rather than erroring -- title and description
         showed up fine, but no photo. og-share.jpg is that same emblem,
         generated once via a throwaway script (see git history), flattened
         onto a plain white background (rather than leaving transparency-
         compositing up to each platform, which isn't consistent) and
         re-exported as an 800x800, ~60KB JPEG built specifically for this.

         Static and site-wide, same scope as the <title>/<meta description>
         above (this project has no per-page Seo component — see
         MainLayout.jsx) — an admin who sets Settings → SEO title/
         description only updates the tab title and search-result
         snippet, not these share-card tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khuma Aryal Foundation" />
    <meta property="og:title" content="Khuma Aryal Foundation" />
    <meta
      property="og:description"
      content="Khuma Aryal Foundation — working for Education, Healthcare, Sports & Employment, guiding young people away from problems through good counselling."
    />
    <meta property="og:url" content="https://khumaaryalfoundation.org.np/" />
    <meta property="og:image" content="https://khumaaryalfoundation.org.np/images/og-share.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="Khuma Aryal Foundation logo" />

    <!-- "summary" (small square thumbnail), not "summary_large_image" --
         the logo is a 1:1 square, and a large-image card crops non-1.91:1
         images down to a landscape banner, which would slice into the
         logo's circular text arc and the "KAF" ribbon at the bottom. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Khuma Aryal Foundation" />
    <meta
      name="twitter:description"
      content="Khuma Aryal Foundation — working for Education, Healthcare, Sports & Employment, guiding young people away from problems through good counselling."
    />
    <meta name="twitter:image" content="https://khumaaryalfoundation.org.np/images/og-share.jpg" />

    <!-- JSON-LD structured data (schema.org) — tells Google explicitly
         "this site is an NGO named X" instead of making it guess from
         visible text. Static and site-wide (same scope as the OG tags
         above); per-page types (NewsArticle/Event/JobPosting) are added on
         top of this by useJsonLd.js on the relevant detail pages. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Khuma Aryal Foundation",
        "url": "https://khumaaryalfoundation.org.np",
        "logo": "https://khumaaryalfoundation.org.np/images/og-share.jpg",
        "description": "Khuma Aryal Foundation — working for Education, Healthcare, Sports & Employment, guiding young people away from problems through good counselling."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded async (preload as style, swap to a real stylesheet once it
         arrives) instead of a plain blocking <link rel="stylesheet"> --
         that was holding up first paint on every page load waiting on a
         round trip to fonts.googleapis.com. display=swap (already in the
         URL) means the fallback font shows immediately regardless and
         swaps once the webfont's loaded, so nothing about the font
         experience changes here, it just stops blocking the render. The
         <noscript> tag is the fallback for the rare case JS is disabled. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
